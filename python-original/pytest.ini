[pytest]
testpaths = tests
addopts = -ra --strict-markers --timeout=900
pythonpath = .
markers =
    e2e: runs the tool end to end on a fixture dataset
    viewer: opens a report in a headless browser (needs playwright and its chromium)
    regression: pins the current outputs of the tool on the fixture datasets (re-pin with tests/data/make_fixtures.py --golden after a deliberate method change)
    property: property-based tests (hypothesis)
    real: runs on the excerpts of real alignments
    slow: takes more than about ten seconds alone
    allow_errors: a viewer test that expects page errors (a refused or corrupted report)
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
